<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi, I am Spidy</title>
    
    <!-- Google Fonts for premium clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Floating Messi Toggle Button -->
    <button id="messi-toggle" class="messi-btn" aria-label="Toggle Messi Mode">
        <span>Messi ⚽</span>
    </button>

    <!-- Floating Music Toggle Button -->
    <button id="music-toggle" class="music-btn" aria-label="Toggle Music">
        <!-- Muted Icon -->
        <svg id="mute-icon" class="music-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
        <!-- Unmuted Icon -->
        <svg id="unmute-icon" class="music-icon hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
    </button>

    <!-- Background Video -->
    <div class="video-container">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="Untitled.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <!-- Main Content -->
    <main class="content-container">
        <!-- Spidy Image -->
        <div class="image-wrapper">
            <img src="images-removebg-preview.png" alt="Spidy" class="spidy-img">
            <img src="messi.png" alt="Messi" class="messi-img">
        </div>
        <!-- Typing Animation Text -->
        <h1 class="typing-title">
            <span id="typed-text"></span><span class="cursor">|</span>
        </h1>
    </main>

    <!-- Chatbot Container -->
    <div id="chatbot-container" class="chatbot-container">
        <!-- Chatbot Window -->
        <div id="chat-window" class="chat-window hidden">
            <div class="chat-header">
                <div class="chat-header-info">
                    <video autoplay muted loop playsinline class="chat-dp">
                        <source src="chatbot-dp.mp4" type="video/mp4">
                    </video>
                    <span class="chat-title">Spidy</span>
                </div>
                <button id="close-chat" class="close-btn" aria-label="Close Chat">&times;</button>
            </div>
            <div id="chat-messages" class="chat-messages">
                <div class="msg bot-msg">Hey! Web-slinger here. Send me a message!</div>
            </div>
            <form id="chat-input-form" class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off" required>
                <button type="submit" class="chat-send-btn">Send</button>
            </form>
        </div>

        <!-- Floating Chatbot Toggle Button -->
        <button id="chat-toggle-btn" class="chat-toggle-btn" aria-label="Open Chat">
            <video autoplay muted loop playsinline class="chat-toggle-dp">
                <source src="chatbot-dp.mp4" type="video/mp4">
            </video>
        </button>
        <!-- Looping Chat Prompt Bubble -->
        <div class="chat-prompt-bubble">Chat with me!</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
